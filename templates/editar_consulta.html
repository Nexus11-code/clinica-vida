{% extends "base.html" %}
{% block title %}Editar consulta | Clínica Vida{% endblock %}
{% block content %}
<section class="painel formulario-box"><h1>Editar consulta</h1>
<form method="post" class="formulario">
<label>Paciente<select name="paciente_id" required>{% for p in pacientes %}<option value="{{ p.id }}" {% if p.id == consulta.paciente_id %}selected{% endif %}>{{ p.nome }}</option>{% endfor %}</select></label>
<label>Profissional<input name="medico" value="{{ consulta.medico }}" required></label>
<label>Data<input type="date" name="data_consulta" value="{{ consulta.data_consulta }}" required></label>
<label>Horário<input type="time" name="horario" value="{{ consulta.horario }}" required></label>
<label>Motivo<input name="motivo" value="{{ consulta.motivo }}" required></label>
<label>Status<select name="status">{% for s in ['Agendada','Concluída','Cancelada'] %}<option {% if consulta.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label>
<button class="botao">Salvar alterações</button><a href="{{ url_for('consultas') }}">Voltar</a>
</form></section>
{% endblock %}
