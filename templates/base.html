<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Clínica Vida{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topo">
  <a class="marca" href="{{ url_for('inicio') }}">Clínica Vida</a>
  <nav>
    <a href="{{ url_for('inicio') }}">Início</a>
    <a href="{{ url_for('pacientes') }}">Pacientes</a>
    <a href="{{ url_for('consultas') }}">Consultas</a>
  </nav>
</header>
<main class="container">
  {% with mensagens = get_flashed_messages(with_categories=true) %}
    {% for categoria, mensagem in mensagens %}
      <div class="alerta {{ categoria }}">{{ mensagem }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>Projeto acadêmico fictício • MedTec 2026</footer>
</body>
</html>
